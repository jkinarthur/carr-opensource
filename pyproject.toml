[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carr-v2"
version = "0.1.0"
description = "Differentiable collapse-aware compression for recommendation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
